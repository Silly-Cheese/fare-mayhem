name: Build and deploy Fare Mayhem
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --no-audit --no-fund
      - run: npm run test
      - run: npm --prefix functions install --no-audit --no-fund
      - run: npm --prefix functions run test
      - run: npm run build
      - name: Check custom-domain build outputs
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/manifest.webmanifest
          test -f dist/favicon.svg
          test -f dist/robots.txt
          test -f dist/sitemap.xml
          if grep -E '/fare-mayhem/' dist/index.html dist/manifest.webmanifest; then
            echo "::error::Legacy GitHub path found in custom-domain build"
            exit 1
          fi
          grep -F 'https://fare-mayhem.com/' dist/index.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
